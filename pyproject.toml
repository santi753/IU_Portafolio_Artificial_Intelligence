[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newsentiment"
version = "0.1.0"
description = "CLI that classifies recent company news headlines as negative, neutral or positive."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "requests",
    "feedparser",
    "joblib",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
